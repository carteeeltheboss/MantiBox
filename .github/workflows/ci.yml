name: ci

on:
  push:
    branches: [main]
  pull_request:

# The fast gate must not need a GPU, a model download or the compose stack.
# Integration tests run in the `integration` job below against real services.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + types + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev, from the lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy src

      - name: pytest (fast markers only)
        run: pytest -m "not integration and not gpu and not slow" --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so gitleaks can scan the whole history, not just the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: integration against real services
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Start services (CPU baseline, no gpu profile)
        run: docker compose up -d --build qdrant postgres minio mlflow mcp-server

      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6333/healthz >/dev/null 2>&1; then
              echo "qdrant up"; exit 0
            fi
            sleep 2
          done
          echo "qdrant never became healthy"; docker compose ps; exit 1

      - name: Generate corpus
        run: python scripts/generate_corpus.py

      - name: Ingest
        run: python -m maintidoc.cli ingest

      - name: pytest -m integration
        run: pytest -m integration
        env:
          MAINTIDOC_VLM_PROVIDER: stub

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=300
